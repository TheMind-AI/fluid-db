name: Publish npm

on:
  push:
    tags: ["v1.0.0-next.*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # @ref LLP 0023#packaging — publish the tested combined artifact using package-specific OIDC trust
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: fluiddb-package
          path: release
      - name: Publish verified package
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release/*.tgz)
          test "${#artifacts[@]}" -eq 1
          npm publish "./${artifacts[0]}" --access public --tag next --ignore-scripts --registry=https://registry.npmjs.org/

  verify-registry:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Wait for registry processing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            if npm view "@fluiddb/fluiddb@$version" version --prefer-online; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify published consumers
        run: bun run verify:registry
        env:
          npm_config_cache: ${{ runner.temp }}/fluiddb-registry-cache
